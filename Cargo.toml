[package]
name = "audiodub"
version = "0.3.8"
edition = "2021"
authors = ["AudioDub Contributors"]
description = "AI-powered desktop audio translation and dubbing for Linux"
license = "MIT"

[dependencies]
# GUI
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"

# Async & Networking
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7" }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
async-channel = "2.3"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling & Utilities
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tempfile = "3.10"
dirs = "5.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Secrets
keyring = { version = "2.1", optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"

[[test]]
name = "domain_test"
path = "tests/unit/domain_tests.rs"

[[test]]
name = "audio_engine_test"
path = "tests/integration/audio_engine_test.rs"

[[test]]
name = "pipeline_flow_test"
path = "tests/integration/pipeline_flow_test.rs"

[[test]]
name = "crash_recovery_test"
path = "tests/integration/crash_recovery_test.rs"

[[test]]
name = "failure_cases_test"
path = "tests/integration/failure_cases_test.rs"

[[test]]
name = "real_workflow_test"
path = "tests/integration/real_workflow_test.rs"

[[test]]
name = "performance_benchmark"
path = "tests/integration/performance_benchmark.rs"
