name: Linux Live Dubber CI

on:
  push:
    branches:
      - fix/live-dubber-linux-native
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev ffmpeg \
            pipewire pipewire-pulse wireplumber
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Release build
        run: cargo build --release --all-features
