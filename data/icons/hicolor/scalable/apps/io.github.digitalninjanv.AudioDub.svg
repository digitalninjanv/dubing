  <path d="M 96 64 Q 96 44 80 36" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Audio Waveform Bars -->
  <rect x="36" y="52" width="6" height="24" rx="3" fill="url(#waveGrad)" />
  <rect x="46" y="40" width="6" height="48" rx="3" fill="url(#waveGrad)" />
  <rect x="56" y="32" width="6" height="64" rx="3" fill="url(#waveGrad)" />
  <rect x="66" y="44" width="6" height="40" rx="3" fill="url(#waveGrad)" />
  <rect x="76" y="36" width="6" height="56" rx="3" fill="url(#waveGrad)" />
  <rect x="86" y="50" width="6" height="28" rx="3" fill="url(#waveGrad)" />

  <!-- Subtle Translation Sparkle -->
